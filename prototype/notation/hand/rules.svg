<text x="1143.0" y="124.0" font-size="13" font-style="italic" fill="#000" text-anchor="start">Enemy idle</text>
<text x="1143.0" y="314.0" font-size="13" font-style="italic" fill="#000" text-anchor="start">Enemy winding up</text>
<text x="1143.0" y="467.0" font-size="13" font-style="italic" fill="#000" text-anchor="start">Enemy's blow</text>
<text x="1143.0" y="481.0" font-size="13" font-style="italic" fill="#000" text-anchor="start">coming</text>
<text x="1143.0" y="694.0" font-size="13" font-style="italic" fill="#000" text-anchor="start">Enemy recovering</text>
